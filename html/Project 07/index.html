<!doctype html>
<html>
  <head>
    <title>Project 07</title>

    <style>
      body {
        background-color: #f2b1b4;
      }

      ul {
        list-style-type: none;
      }

      li {
        font-size: 20px;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
          padding-top: 10px;
      }

      li:hover{
        font-style: italic;
        font-weight: 900;
      }

      /* this is the only way & will apply only for a tags that havent own inline style  */
      a:hover {
        color: red;
      }
    </style>
  </head>
  <body>
    <ul>
      <!-- open in same tab -->
      <li><a href="http://www.google.com">About us</a></li>

      <!-- open in another tab -->
      <li><a href="http://www.google.com" target="_blank">Recources</a></li>

      <!-- link status colors -->
      <li>
        <a
          href="http://www.google.com"
          target="_blank"
          style="color: black; text-decoration: none"
          >Coding</a
        >
      </li>
      <li>
        <a
          href="http://www.google.com"
          target="_blank"
          style="color: black; text-decoration: none"
          >location</a
        >

        <li><a href="http://www.google.com">All</a></li>
      </li>
    </ul>
  </body>
</html>
