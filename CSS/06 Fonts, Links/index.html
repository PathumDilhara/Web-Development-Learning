<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/utilities.css"
    /> -->

    <style>
      a {
        font-size: 30px;
      }

      /* normal link color */
      a:link {
        color: red;
        text-decoration: none;
      }

      /* when cursor is on link */
      a:hover {
        color: green;
      }

      /* after clicked */
      a:visited {
        color: purple;
      }

      /* When clicking */
      a:active {
        color: yellow;
      }
    </style>
  </head>
  <body>
    <!-- Helveticais next fall down if airal not work sanserif is any deafalt text Helvetica not available -->
    <h1
      style="
        font-family: Arial, Helvetica, sans-serif;
        font-style: italic;
        font-weight: 200;
        font-variant: small-caps;
        text-transform: capitalize;
      "
    >
      This is heading
    </h1>

    <!-- em = browser default fontsize -->
    <h1 style="font-size: 3em">em heading</h1>
    <h1 style="font-size: 10vw">vw heading</h1>
    <br /><br /><br />

    <i class=""></i>

    <a href="#">Click here</a>
  </body>
</html>
