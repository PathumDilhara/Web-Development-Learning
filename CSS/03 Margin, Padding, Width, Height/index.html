<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div style="background-color: red">
      <h2 style="margin-top: 30px">Div 01</h2>
    </div>

    <div style="background-color: green">
      <h2 style="margin-left: 100px">Div 02</h2>
    </div>

    <div
      style="
        padding: 100px;
        background-color: bisque;
        width: 220px;
        box-sizing: border-box;
      "
    >
      <h2 style="padding: inherit">Padding</h2>
    </div>

    <div
      style="
        background-color: blue;
        padding: 100px;
        width: 3000px;
        max-width: 800px;
      "
    >
      <h2>Widhth handling</h2>
    </div>

    <div
      style="
        background-color: red;
        width: 200px;
        height: 100px;
        max-width: 600px;
        min-width: 300px;
        min-height: 200px;
      "
    >
      <h2>min max Height</h2>
    </div>
  </body>
</html>

affect to outer side from element
